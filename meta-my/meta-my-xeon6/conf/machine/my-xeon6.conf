# my-xeon6 is derived from the Quanta S6Q (aspeed AST2600) hardware and reuses
# its kernel device tree. There is no dedicated my-xeon6 device tree upstream
# yet, so point at the existing S6Q dtb. Once a custom device tree is added to
# the kernel, switch this to aspeed/aspeed-bmc-quanta-my-xeon6.dtb.
KERNEL_DEVICETREE = "aspeed/aspeed-bmc-quanta-s6q.dtb"

UBOOT_MACHINE = "ast2600_openbmc_defconfig"
UBOOT_DEVICETREE = "ast2600a1-evb"

require conf/machine/include/ast2600.inc
require conf/machine/include/obmc-bsp-common.inc

SOCSEC_SIGN_ENABLE = "0"

FLASH_SIZE = "65536"

MACHINE_FEATURES += "\
        obmc-bmc-state-mgmt \
        obmc-chassis-state-mgmt \
        obmc-host-ipmi \
        obmc-host-state-mgmt \
        obmc-phosphor-chassis-mgmt \
        obmc-phosphor-fan-mgmt \
        obmc-phosphor-flash-mgmt \
        bonding \
        "

VIRTUAL-RUNTIME_obmc-inventory-manager = "entity-manager"
PREFERRED_PROVIDER_virtual/obmc-inventory-data = "entity-manager"
VIRTUAL-RUNTIME_obmc-host-state-manager ?= "x86-power-control"
VIRTUAL-RUNTIME_obmc-chassis-state-manager ?= "x86-power-control"
PREFERRED_PROVIDER_virtual/obmc-chassis-mgmt = "packagegroup-my-xeon6-apps"
PREFERRED_PROVIDER_virtual/obmc-fan-mgmt = "packagegroup-my-xeon6-apps"
PREFERRED_PROVIDER_virtual/obmc-flash-mgmt = "packagegroup-my-xeon6-apps"
PREFERRED_PROVIDER_virtual/obmc-host-ipmi-hw ?= "phosphor-ipmi-kcs"
PREFERRED_PROVIDER_virtual/obmc-system-mgmt = "packagegroup-my-xeon6-apps"
